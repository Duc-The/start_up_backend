services:
  # PostgreSQL
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ocop_tourism
      POSTGRES_USER: ocop
      POSTGRES_PASSWORD: ocop_pg_dev
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # MongoDB
  mongo:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: ocop
      MONGO_INITDB_ROOT_PASSWORD: ocop_mongo_dev
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  # Redis
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  mongo_data:
  redis_data: